<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<style>
    *{
        font-family: "Oswald", sans-serif;
    }
</style>
<body>
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Launch demo modal
</button>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header centered-modal-header">
        <h1 class="modal-title responsive-title text-outline" id="exampleModalLabel">Wait you're not logged in!</h1>
      </div>
      <div class="modal-body">
        <section class="modal-group">
            <h1 class="fs-6 ">Would you like to</h1>
            <button class="custom-button">Create account</button>
        </section>
        <section class="modal-group custom-row">
            <hr class="custom-hr">
            <span class="mx-1">OR</span>
            <hr class="custom-hr">
        </section>
        <section class="modal-group">
            <h1 class="fs-6">Already have an account?</h1>
            <button class="custom-button" id="loginBtn">Login</button>
        </section>
        
      </div>
      <div class="modal-footer">
        <button type="button" class="custom-button" data-bs-dismiss="modal">Close</button>
      </div>    
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
