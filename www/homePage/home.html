<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">
    <title>home</title>
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    
</head>
<body>
    <header>
        <aside class="logo"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section class="buttonsTopRow">
            <button class="circle-button"><img src="../Resources/Icons/mute-svgrepo-com.svg" alt="mute" height="30px" width="30px"></button>
        </section>
    </header>
    <main>
        <article class="gamelogo"><img src="../Resources/Logo/draftosaurusLogo.png" alt="draftosaurusLogo"></article>
    </main>
    <footer class="footerMenu">
        <div class="footer-buttonRow">
            <button class="circle-button" id="SETTINGSbtn"><img src="../Resources/Icons/settings-svgrepo-com.svg" alt="Settings"></button>
            <button class="circle-button" id="PLAYbtn"><img src="../Resources/Icons/play-1003-svgrepo-com.svg" alt=""></button>
            <button class="circle-button" id="PROFILEbtn"><img src="../Resources/Icons/profile-round-1346-svgrepo-com.svg" alt=""></button>
        </div>

            <!--Settings_Section-->
            <section class="footerbody hidden" id="SETTINGS"><!--Hidden-->    
                <header class="mb-2 text-center">
                    <h1 class="footerTitle">Settings</h1>
                    <hr>
                </header>
                <section>
                    <!-- Volume control -->
                    <div class="row">
                        <span>Volume:</span>
                        <input type="range" min="0" max="100" step="1" value="100" class="volSlider">
                        <span>100</span>
                    </div>
                    <!-- Graphics dropdown -->
                    <div class="row">
                    <span>Graphics:</span>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle customDropdown" type="button" id="graphicsDropdownButton" data-bs-toggle="dropdown" aria-expanded="false">
                            Select
                        </button>
                        <ul class="dropdown-menu customdropdownmenu" aria-labelledby="graphicsDropdownButton">
                            <li><a class="dropdown-item" href="#">Low</a></li>
                            <li><a class="dropdown-item" href="#">Medium</a></li>
                            <li><a class="dropdown-item" href="#">High</a></li>
                        </ul>
                    </div>
                </section>
            </section>
            <!--Play_Section-->
            <section class="footerbody hidden" id="PLAY">
                <header class="mb-2 text-center">
                    <h1 class="footerTitle">Play</h1>
                    <hr>
                </header>
                <section>
                    <!-- Top section: Join game -->
                    <section class="playSection">
                    <input type="text" placeholder="Insert Game Code">
                    <button class="circle-button">join</button>
                    <p>or</p>
                    </section>
                    <!-- Bottom section: Host game -->
                    <section class="playSection">
                    <button class="circle-button">Host a game</button>
                    </section>
                </section>
            </section>
            <!--Profile_Section-->
            <section class="footerbody hidden" id="PROFILE">
                <header class="mb-2 text-center">
                    <h1 class="footerTitle">Profile</h1>
                    <hr>
                </header>
                
 <section>
                    <!-- Avatar row -->
                    <div class="row mb-0 space-between">
                        <div>
                            <img src="../Resources/Icons/defautlprofilepic.png" class="profilepic">
                            <span class="fs-1 fs-md-3 fs-lg-5">PlayerName</span>
                        </div>
                        
                        
                            <button class="circle-button" id="profileSettingsBtn">
                                <img src="../Resources/Icons/settings-svgrepo-com.svg">
                            </button>
                    </div>
                    
                    

                    <!-- Tabbed content -->
                    <article>
                    <nav>
                        <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="general-tab" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#general-tab-pane" aria-controls="general-tab-pane" aria-selected="true">General</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pD-tab" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#pD-tab-pane" aria-controls="pD-tab-pane" aria-selected="false">Personal Data</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="stats-tab" type="button" role="tab" data-bs-toggle="tab" data-bs-target="#stats-tab-pane" aria-controls="stats-tab-pane" aria-selected="false">Stats</button>
                        </li>
                        </ul>
                    </nav>

                    <section class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="general-tab-pane" role="tabpanel" aria-labelledby="general-tab" tabindex="0">
                        General Stuff. Under construction
                        </div>
                        <div class="tab-pane fade" id="pD-tab-pane" role="tabpanel" aria-labelledby="pD-tab" tabindex="0">
                        Personal Data stuff. Under construction
                        </div>
                        <div class="tab-pane fade" id="stats-tab-pane" role="tabpanel" aria-labelledby="stats-tab" tabindex="0">
                        Under construction
                        </div>
                    </section>
                    </article>
                </section>
            </section>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="home.js"></script>
</body>
</html>
