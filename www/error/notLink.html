<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activación inválida - Draftosaurus</title>
  <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: 'Oswald', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }
    img { width: 180px; margin-bottom: 20px; }
    h1 { font-size: 2.5rem; text-shadow: 2px 2px 0 #f1c232; margin: 0.5em 0 0.2em 0; }
    p { font-size: 1.2rem; color: #ccc; max-width: 400px; }
    button {
      background-color: transparent;
      border: 2px solid #f1c232;
      color: #f1c232;
      padding: 10px 25px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1.5em;
    }
    button:hover { background-color: #f1c232; color: #0d0d0d; }
  </style>
</head>
<body>
  <img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBloom">
  <h1>Link de activación inválido</h1>
  <p>El enlace de activación ha expirado o ya fue utilizado.<br>Por favor, solicita nuevamente el correo de activacion de cuenta.</p>
  <button onclick="location.href='/auth/login.html'">Ir al login</button>
</body>
</html>
