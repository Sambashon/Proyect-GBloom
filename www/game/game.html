<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>
    <link rel="icon" href="/Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/general.css">
    <link rel="stylesheet" href="/src/css/modal.css">
    <link rel="stylesheet" href="game.css">
    
</head>
<body>
    <div id="loading">
        <img src="/Resources/Icons/cargando.gif" width="100px" style="margin: auto;"></img>
    </div>
    <!-- Host Leave Modal -->
    <div class="modal fade" id="hostModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header centered-modal-header">
                <h1 class="modal-title responsive-title text-outline" id="modalLabel">You're the host</h1>
            </div>
            <div class="modal-body">
                <section class="modal-group">
                    <h1 class="responsive-subtitle text-outline">Are you sure you want to end the game session?</h1>
                </section>                
            </div>
            <div class="modal-footer">
                <button type="button" class="custom-button dark-red" id="backBtn">Leave</button>
                <button type="button" class="custom-button" data-bs-dismiss="modal">Cancel</button>
            </div>    
            </div>
        </div>
    </div>
    <!--
    <a href="../../winorlose/lose/lose.html" class="fs-6">Simulate Loss</a>
    <a href="../../winorlose/win/win.html" class="fs-6">Simulate Win</a>
    -->    
    <header class="topHeader">
        <div class="logo-container"><img src="/Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM" class="img-fluid"></div>
        <section class="nav-buttons">
            <button class="custom-button circle-button"><img src="/Resources/Icons/pause-svgrepo-com.svg" id="pauseBtn" data-bs-toggle="modal" data-bs-target="#pauseMenu"></button>
            <button class="custom-button circle-button"><img src="/Resources/Icons/stats-svgrepo-com.svg" id="statsBtn" data-bs-toggle="modal" data-bs-target="#leaderboardMenu"></button>
        </section>
    </header>
    <!--Pause Menu-->
    <div class="modal fade" id="pauseMenu" tabindex="-1" aria-labelledby="pauseMenu" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title responsive-title text-outline" id="pauseMenu">PAUSE</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <section class="modal-group">
                    <button class="custom-button circle-button dark-red" id="SETTINGSBtn"  data-bs-toggle="modal" data-bs-target="#settingsMenu"><img src="../../Resources/Icons/settings-svgrepo-com.svg" alt="settings"></button>
                    <button class="custom-button circle-button dark-red" id="PLAYBtn" style="margin-bottom: 30px;"><img src="../../Resources/Icons/play-1003-svgrepo-com.svg" alt="play"></button>
                    <button class="custom-button circle-button dark-red" id="LEAVEBtn"><img src="../../Resources/Icons/leave-svgrepo-com.svg" alt="leave" data-bs-toggle="modal" data-bs-target="#hostModal"></button>
                </section>
            </div>
            </div>
        </div>
    </div>

        <!--LeaderBoard-->
    <div class="modal fade" id="leaderboardMenu" tabindex="-1" aria-labelledby="leaderboardMenu" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title responsive-title text-outline" id="leaderboardMenu">LEADERBOARD</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <section class="modal-column">
                    <div class="leaderboard-container">
                        <div class="table-wrapper">
                            <table class="leaderboard-table">
                            <thead>
                                <tr>
                                <th>Player</th>
                                <th>Score</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                <td>You</td>
                                <td>0 pts</td>
                                </tr>
                            </tbody>
                            </table>
                        </div>
                        </div>
                </section>
            </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="settingsMenu" tabindex="-1" aria-labelledby="settingsMenu" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header centered-modal-header">
                    <h1 class="modal-title responsive-title text-outline" id="settingsMenu">Settings</h1>
                </div>
                <div class="modal-body">
                    <div class="modal-column" style="gap:10px;">
                        <div class="row-custom">
                            <span class="text-outline responsive-subtitle">Music:</span>
                            <input type="range" min="0" max="100" step="1" value="100" class="mscSlider" id="mscSlider">
                            <span class="text-outline responsive-subtitle" id="mscValue" style="width: 30px;">100</span>
                        </div>
                        <div class="row-custom">
                            <span class="text-outline responsive-subtitle">Sound Effects:</span>
                            <input type="range" min="0" max="100" step="1" value="100" class="sfxSlider" id="sfxSlider">
                            <span class="text-outline responsive-subtitle" id="sfxValue" style="width: 30px;">100</span>
                        </div>
                        <div class="row-custom">
                            <span class="text-outline responsive-subtitle">Game resolution:</span>
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle customDropdown" type="button" id="gameResDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">Select</button>
                                <ul class="dropdown-menu customdropdownmenu" aria-labelledby="gameResDropdownBtn">
                                    <li class="dropdown-item" id="gameres">LOW</li>
                                    <li class="dropdown-item" id="gameres">MEDIUM</li>
                                    <li class="dropdown-item" id="gameres">HIGH</li>
                                </ul>
                            </div>
                        </div>
                        <div class="row-custom">
                            <span class="text-outline responsive-subtitle">Language</span>
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle customDropdown" type="button" id="antiAliDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">ENGLISH</button>
                                <ul class="dropdown-menu customdropdownmenu" aria-labelledby="antiAliDropdownBtn">
                                    <li class="dropdown-item" id="language">ENGLISH</li>
                                    <li class="dropdown-item" id="language">ESPAÑOL</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
    <main class="main-container">
        <canvas></canvas>
    </main>
    
    <footer class="dock">
            <aside class="DICE-CONTAINER">
                <section>
                    <img src="/Resources/Icons/cargando.gif" class="mx-auto d-block" id="dice">
                </section>
            </aside>
            <section class="INVENTORY-WRAPPER">
                <header class="title-row">
                    <h4 class="responsive-subtitle text-outline">Dino Inventory</h4>
                </header>
                <section class="INVENTORY">
                    <section>
                        <img src="/Resources/dinosaurios/dinoAmarillo.svg" alt="DinoAmarillo">
                        <span class="text-outline"></span>
                    </section>
                    <section>
                        <img src="/Resources/dinosaurios/dinoAzul.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span class="text-outline"></span>
                    </section>
                    <section>
                        <img src="/Resources/dinosaurios/dinoRojo.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span class="text-outline"></span>
                    </section>
                    <section>
                        <img src="/Resources/dinosaurios/dinoMorado.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span class="text-outline"></span>
                    </section>
                    <section>
                        <img src="/Resources/dinosaurios/dinoVerde.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span class="text-outline"></span>
                    </section>
                    <section>
                        <img src="/Resources/dinosaurios/dinoNaranja.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span class="text-outline"></span>
                    </section>
                </section>
                
            </section>
        </footer>
        <section id="curtain">
        </section>
    
    <script src="/engine/utilities/engine.js" defer></script>
    <script defer>
        let body = document.querySelector("body");
        let utilities = document.createElement("script");

        if (navigator.gpu) {
            utilities.src = "/engine/utilities/JSCGL.js";
        } else {
            utilities.src = "/engine/utilities/JSCGL1.js";
        }

        body.appendChild(utilities);
    </script>
    <script src="/engine/draftosaurus/clases/InputListener.js" defer></script>
    <script src="/engine/draftosaurus/clases/Tablero.js" defer></script>
    <script src="/engine/draftosaurus/clases/Sounds.js" defer></script>
    <script src="/engine/draftosaurus/clases/Inventario.js" defer></script>
    <script src="index.js" defer></script>
    <script src="gameUI.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
