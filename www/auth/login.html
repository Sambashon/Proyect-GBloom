<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/general.css">
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header class="topHeader">
        <div class="logo-container"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM" class="img-fluid"></div>
        <section>
            <button class="custom-button" id="xOut"><h2>x</h2></button>
        </section>
    </header>
    <main class="main-container">
        <div class="form-container">
            <h1 class="text-outline responsive-title text-center">Login</h1>
            <form action="">
                <div class="form-group">
                    <label for="username" class="responsive-subtitle text-outline">Username</label>
                    <input type="text" name="username" id="username" class="custom-input responsive-text" required>
                </div>
                <div class="form-group">
                    <label for="password" class="responsive-subtitle text-outline">Password</label>
                    <input type="password" name="password" id="password" class="custom-input responsive-text" required>
                </div>
                <div class="form-footer">
                    <input type="checkbox" class="form-check-input" id="checkBox">
                    <label class="text-outline form-check-lable" for="checkBox">
                        Stay Logged In
                    </label>
                    <input type="submit" class="custom-button right">
                </div>

            </form>
        </div>
    </main>
    <script src="ui.js"></script>
    <script src="login.js"></script>
</body>
</html>
