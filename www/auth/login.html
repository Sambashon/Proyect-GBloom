<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Resources/Logo/GbloomClassic.svg">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/general.css">
    <link rel="stylesheet" href="../src/css/forms.css">
</head>
<body>
    <header class="topHeader">
        <div class="logo-container"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM" class="img-fluid"></div>
        <section>
            <button class="custom-button" id="xOut"><h2>x</h2></button>
        </section>
    </header>
    <main class="main-container">
        <div class="form-container">
            <header class="formHeader"><h1 class="fs-2 text-outline text-center">Login</h1></header>
            <form method="POST"> 
                <input type="hidden" name="formType" value="login">
                <div class="form-group">
                    <label for="username" class="text-outline fs-4">Username</label>
                    <input class="form-control" name="username" id="username">
                </div>
                <div class="form-group">
                    <label for="password" class="text-outline fs-4">Password</label>
                    <input type="password" class="form-control" name="password" id="password">
                </div>
                <div class="center">
                    <input type="submit" class="custom-button" value="Sign Up">
                </div>
                
            </form>
        </div>
    </main>
    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
