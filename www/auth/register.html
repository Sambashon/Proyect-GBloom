<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../src/css/general.css">
    <link rel="stylesheet" href="../src/css/modal.css">
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header class="topHeader">
        <div class="logo-container"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM" class="img-fluid"></div>
        <section>
            <button class="custom-button" id="xOut"><h2>x</h2></button>
        </section>
    </header>

    <!--MODAL-->

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <img src="/Resources/Icons/cargando.gif" width="100px" style="margin: auto;"></img>
        </div>
    </div>

    <main class="main-container">
        <div class="form-container">
            <h1 class="text-outline responsive-title text-center">Register</h1>
            <div id="registerError" class="text-outline" style="color: #f1c232; margin-bottom: 0.5rem; display: none;"></div>
            <form action="">
                <div class="form-group">
                    <label for="username" class="responsive-subtitle text-outline">Username</label>
                    <input type="text" name="username" id="username" class="custom-input responsive-text">
                </div>
                <div class="form-group">
                    <label for="email" class="responsive-subtitle text-outline">Email</label>
                    <input type="email" name="email" id="email" class="custom-input responsive-text">
                </div>
                <div class="form-group">
                    <label for="password" class="responsive-subtitle text-outline">Password</label>
                    <div class="custom-row">
                        <input type="password" name="password" id="password" class="custom-input responsive-text passwordInputs">
                    </div>
                </div>  
                <div class="form-footer">
                    <input type="checkbox" class="form-check-input" id="checkBox">
                    <label class="text-outline form-check-lable" for="checkBox">
                        I have read and agree with 
                        <a href="TOS_GBloom_EN.pdf" target="_blank">
                        GBloom TOS
                        </a>
                    </label>
                    <input type="submit" class="custom-button right" data-bs-toggle="modal" data-bs-target="#exampleModal">
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="register.js"></script>
    <script src="ui.js"></script>
    <script src="../src/js/passwordEyes.js"></script>
</body>
</html>
