<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../src/css/general.css">
    <link rel="stylesheet" href="config.css">
</head>
<body>
    <header class="topHeader">
        <div class="logo-container"><img src="../../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM" class="img-fluid"></div>
        <button class="custom-button circle-button"><img src="../../Resources/Icons/leave-svgrepo-com.svg" alt="back" id="backBtn"></button>
    </header>
    <main class="main-container">
        <header class="pageHeader">
            <h1 id="partyName" class="responsive-title text-outline">Your party</h1>
            <button class="custom-button" id="editBtn">Edit</button>
        </header>

        <article class="customContainer">
            <div class="row g-2">
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">2</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">3</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">4</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">5</section>
                </div>
            </div>
        </article>
        <footer>
            <div class="customRow">
                <button class="custom-button ftbt" id="virtual">Virtual Game</button>
                <button class="custom-button ftbt" id="sync">Board - Sync</button>
            </div>
            <button class="custom-button" id="startBtn">start</button>
        </footer>
        <script src="config.js"></script>
    </main>
</body>
</html>
