<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="main-container">
        <section class="avatar-section">
            <header class="profile-header">
                    <button class="custom-button circle-button" id="leaveBtn"><img src="../Resources/Icons/leave-svgrepo-com.svg" alt=""></button>
            </header>
             <div class="picture-container">
                <img src="../Resources/Icons/defautlprofilepic.png" alt="profilepic" class="img-fluid">
                <button class="circle-button editBtn">✎</button>
            </div>
        </section>
        <main class="form-section">
            <header class="header">
                <h1 class="text-outline fs-1 fw-bold text-center">Profile Settings</h1>
                <p class="text-outline fs-5 fw-bold text-center">Manage your account information</p>
            </header>
            
            <form action="">
                <div class="form-group">
                    <label for="username" class="fs-4">Username</label>
                    <input name="username" id="username" type="text" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-group">
                    <label for="email" class="fs-4">Email</label>
                    <input type="text" name="email" id="email" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-group">
                    <label for="password" class="fs-4">Password</label>
                    <input  type="password" name="password"  id="password" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-text-area">
                    <label for="about" class="fs-4">About me</label>
                    <textarea type="text" name="about" id="about" class="fs-8 clickable">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ut veritatis alias maiores. Minus reiciendis itaque vero. Quia reiciendis culpa doloribus sequi, libero maxime, quod ipsa, ipsam eligendi cupiditate incidunt voluptatum!</textarea>
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <hr>
                <div class="form-footer">
                    <input type="submit" class="custom-button" value="Save changes">
                    <button class="custom-button dark-red" type="button">Logout</button>
                </div>
                
            </form>
        </main>
    </div>
    <script src="settings.js"></script>
</body>
</html>
