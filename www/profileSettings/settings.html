<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings</title>
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../src/css/modal.css">
    <link rel="stylesheet" href="../src/css/general.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <!--Unsaved changes popup-->
    <div class="modal fade" id="unsavedModal" tabindex="-1" aria-labelledby="unsavedModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header centered-modal-header">
                <h1 class="modal-title responsive-text text-outline">Wait you've got unsaved changes, are you sure you want to leave?</h1>
            </div>
            <div class="modal-footer">
                <button type="button" class="custom-button dark-red" id="modalleaveBtn">Leave</button>
                <button type="button" class="custom-button" data-bs-dismiss="modal">Close</button>
            </div>    
            </div>
        </div>
    </div>
    <!--logout popup-->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
            <div class="modal-header centered-modal-header">
                <h1 class="modal-title responsive-text text-outline">Are you sure you want to log out?</h1>
            </div>
            <div class="modal-footer">
                <button type="button" class="custom-button dark-red" id="logoutBtn">Yes</button>
                <button type="button" class="custom-button" data-bs-dismiss="modal" id="cancelLogoutBtn">No</button>
            </div>    
            </div>
        </div>
    </div>
    <div class="settings-main-container">
        <section class="avatar-section">
            <header class="profile-header">
                    <button class="custom-button circle-button" id="leaveBtn"><img src="../Resources/Icons/leave-svgrepo-com.svg" alt=""></button>
            </header>
             <div class="picture-container">
                <img src="../Resources/Icons/defautlprofilepic.png" alt="profilepic" class="img-fluid">
                <button class="circle-button editBtn">✎</button>
            </div>
        </section>
        <main class="form-section">
            <header class="header"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
                <h1 class="text-outline responsive-title fw-bold text-center">Profile Settings</h1>
                <p class="text-outline responsive-subtitle fw-bold text-center">Manage your account information</p>
            </header>
            
            <form action="">
                <div class="form-group">
                    <label for="username" class="responsive-text text-outline">Username</label>
                    <input name="username" id="username" type="text" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-group">
                    <label for="email" class="responsive-text text-outline">Email</label>
                    <input type="text" name="email" id="email" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-group">
                    <label for="password" class="responsive-text text-outline">Password</label>
                    <input  type="password" name="password"  id="password" class="clickable fs-8">
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <div class="form-text-area">
                    <label for="about" class="responsive-text text-outline">About me</label>
                    <textarea type="text" name="about" id="about" class="fs-8 clickable custom-text-area">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ut veritatis alias maiores. Minus reiciendis itaque vero. Quia reiciendis culpa doloribus sequi, libero maxime, quod ipsa, ipsam eligendi cupiditate incidunt voluptatum!</textarea>
                    <button class="custom-button" type="button">Edit</button>
                </div>
                <hr>
                <div class="form-footer">
                    <input type="submit" class="custom-button" value="Save changes" id="saveSubmit">
                    <button class="custom-button dark-red" type="button" data-bs-toggle="modal" data-bs-target="#logoutModal">Logout</button>
                </div>
                
            </form>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="settings.js"></script>
</body>
</html>
