<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">
    <title>home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
    
</head>
<body>
    <header>
        <aside class="logo"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button"><img src="../Resources/Icons/mute-svgrepo-com.svg" alt="mute" height="30px" width="30px"></button>
        </section>
    </header>
    <main>
        <article class="gamelogo"><img src="../Resources/Logo/draftosaurusLogo.png" alt="draftosaurusLogo"></article>
        
        
    </main>
    <footer>
        <div class="footer-container">  
            <button class="circle-button" id="SETTINGSbtn"><img src="../Resources/Icons/settings-svgrepo-com.svg" alt="Settings"></button>
            <button class="circle-button" id="PLAYbtn"><img src="../Resources/Icons/play-1003-svgrepo-com.svg" alt=""></button>
            <button class="circle-button" id="PROFILEbtn"><img src="../Resources/Icons/profile-round-1346-svgrepo-com.svg" alt=""></button>
        </div>

        <article class="footerSettings footerbody locked">
            <h1>Settings</h1>
            <hr>
            <div class="row">
                <h2>Volume</h2>
                <input type="range" min="1" max="100" value="50" class="volSlider" id="volrange">
                <span id="volVALUE">50</span>
            </div>
            <hr>
            <div class="row">
                <h2>Graphics</h2>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle customDropdown" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                        Select
                    </button>
                    <div class="dropdown-menu customdropdownmenu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="#">Low</a>
                        <a class="dropdown-item" href="#">Medium</a>
                        <a class="dropdown-item" href="#">High</a>
                    </div>
                </div>
            </div>
        </article>
        <article class="footerProfile footerbody locked">
            <div class="row">
                <img src="../Resources/Icons/defautlprofilepic.png" alt="ProfilePicture" id="profilePic">
            </div>
        </article>
    </footer>
    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
