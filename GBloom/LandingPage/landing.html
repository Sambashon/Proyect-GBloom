<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto GBloom</title>
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">
    

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="landing.css">
    <link rel="icon" href="../Resources/Backgrounds/GbloomClassic.svg">
    <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <aside>
                <img src="../Resources/Backgrounds/GBloomHorizontal.svg" alt="GBloom" class="Logo">
            </aside>
            <section class="buttons-row">
                <ul>
                    <li class="TopButtons">
                        <button id="PROFILE">
                            <img src="../Resources/Icons/profile-round-1346-svgrepo-com.svg" width="20">
                            <span>Profile</span>
                        </button>
                    </li>
                    <li class="TopButtons">
                        <button id="SETTINGS">
                            <img src="../Resources/Icons/settings-svgrepo-com.svg" width="20">
                            <span>Settings</span>
                        </button>
                    </li>
                    <li class="TopButtons">
                        <button id="MUTE">
                            <img src="../Resources/Icons/mute-svgrepo-com.svg" width="20">
                            <span>Mute</span>
                        </button>
                    </li>
                </ul>
            </section>
        </nav>
    </header>
    <!-- NAV STUFF ^ -->    
    <main>
        <div class="background-landing"></div>

        <article class="drop-down">
            <section class="profile">
                <h1>PERFIL</h1>
                <h4>Nombre de cuenta</h4>
                <h4>Tiempo jugado</h4>
                <h1>Estadisticas</h1>
                <h4>Puntuacion mas alta</h4>
            </section>
        </article>

        <aside class="side-bar">
            <section class="setting">
                <h1>AJUSTES</h1>
                <h4>Volumen</h4>
                <h4>Graficos</h4>
            </section>
        </aside>

        <button class="play">PLAY</button>
    </main>
    <script src="../interactivity.js" defer></script>
</body>
</html>
