<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto GBloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="game.css">
    <link rel="icon" href="../Resources/Backgrounds/GbloomClassic.svg">
    <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <aside>
                <img src="../Resources/Backgrounds/GBloomHorizontal.svg" alt="GBloom" class="Logo">
            </aside>
            <section class="buttons-row">
                <ul>
                    <li class="TopButtons">
                        <button id="PROFILE">
                            <img src="../Resources/Icons/profile-round-1346-svgrepo-com.svg" width="20">
                            <span>Profile</span>
                        </button>
                    </li>
                    <li class="TopButtons">
                        <button id="SETTINGS">
                            <img src="../Resources/Icons/settings-svgrepo-com.svg" width="20">
                            <span>Settings</span>
                        </button>
                    </li>
                    <li class="TopButtons">
                        <button id="MUTE">
                            <img src="../Resources/Icons/mute-svgrepo-com.svg" width="20">
                            <span>Mute</span>
                        </button>
                    </li>
                    <li class="TopButtons">
                        <button id="LEAVE">
                            <img src="../Resources/Icons/leave-svgrepo-com.svg" alt="Leave">
                            <span>Leave</span>
                        </button>
                    </li>
                </ul>
            </section>
        </nav>
    </header>
    <!-- NAV STUFF ^ -->
    <main>
        <article class="drop-down">
            <section class="profile">
                <h1>PERFIL</h1>
                <p>Nombre de cuenta</p>
                <p>Tiempo jugado</p>
                <h1>Estadisticas</h1>
                <p>Puntuacion mas alta</p>
            </section>
        </article>

        <aside class="side-bar">
            <section class="setting">
                <h1>AJUSTES</h1>
                <p>Volumen</p>
                <p>Graficos</p>
            </section>
        </aside>
        
        <div class="container-fluid">
            <section class="row">
                <section class="col-12 top game">
                    JUEGO
                </section>
            </section>
        <footer>
            <aside class="DICE-CONTAINER">
                <header class="title-row">
                    <h4>Dice restrictions</h4>
                </header>
                <section>
                    <img src="../Resources/dado/dado1.svg" alt="Dado 1" class="img-fluid mx-auto d-block">
                </section>
            </aside>
            <section class="INVENTORY">
                <header class="title-row">
                    <h4>Dino Inventory</h4>
                </header>
                <div class="INVENTORY-WRAPPER">
                    <section>
                        <img src="../Resources/dinosaurios/dinoAmarillo.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../Resources/dinosaurios/dinoAzul.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../Resources/dinosaurios/dinoRojo.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../Resources/dinosaurios/dinoMorado.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../Resources/dinosaurios/dinoVerde.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../Resources/dinosaurios/dinoNaranja.svg" alt="DinoAmarillo" class="img-fluid mx-auto d-block">
                        <span>10x</span>
                    </section>
                </div>
                
            </section>
        </footer>
        </div>
    </main>
    <script src="../interactivity.js" defer></script>
</body>
</html>
