<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <footer>
        <aside class="DICE-CONTAINER">
            <header class="title-row">
                <h4>Dice restrictions</h4>
            </header>
            <div>
                Hola
            </div>

        </aside>
        <section class="INVENTORY">
            <header class="title-row">
                <h4>Dino Inventory</h4>
            </header>
            <div>
                Hola
            </div>
        </section>
    </footer>
    <style>
        footer{
            display: flex;
            flex-direction: row;
            align-items: flex-end; /*alinea cosas a la parte de abajo del contenedor*/
            gap: 0.5rem;
            color: white;
            position: fixed;
            bottom: 0;
            z-index: 1;
            left: 50%;
            transform: translateX(-50%);

            width: 60vw;
            height: 20vh;
            border-top-left-radius: 3rem;
            border-top-right-radius: 3rem;

            border-radius: 2rem;
        }
        .DICE-CONTAINER{
            box-shadow: -4px 0 10px 5px grey;

            bottom: 0;
            padding: 1rem;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            height: 100%;
            width: 25%;
            background-color: black;
        }
        .INVENTORY{
            box-shadow: 4px 0 10px 5px grey;
            padding: 1rem;
            border-top-right-radius: inherit;
            border-top-left-radius: inherit;
            height: 90%;
            width: 75%;
            background-color: purple;
        }
        .title-row{
            padding: 0.5rem;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            width: 100%;
            height: 25%;
            background-color: pink;
        }
    </style>
</body>
</html>
