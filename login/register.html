<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">
    <title>register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
    
</head>
<body>
    <header>
        <aside class="logo"><img src="../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button"><img src="../Resources/Icons/mute-svgrepo-com.svg" alt="mute" height="30px" width="30px"></button>
        </section>
    </header>
    <main>
        <form>
            <div class="m-0">
                <label for="exampleInputEmail1" class="form-label"><h2>Display Name</h2></label>
                <input class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>
            <div class="m-0">
                <label for="exampleInputPassword1" class="form-label"><h2>Username</h2></label>
                <input class="form-control" id="exampleInputPassword1">
            </div>
            <div class="m-0">
                <label for="exampleInputPassword1" class="form-label"><h2>Password</h2></label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="m-0">
                <label for="exampleInputPassword1" class="form-label"><h2>Confrim Password</h2></label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>

            <div class="m-0 p-0 form-check" id="checkbox">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1"><p>I Have read and agree with <a href="google.com" target="_blank">Golden Blossom Privacy Policy and terms of use</a></p></label>
            </div>
            <section id="boton-area">
            <button type="submit" class="btn btn-primary" id="register">Register</button>
            </section>
        </form>
    </main>
    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
