<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="config.css">
</head>
<body>
    <header class="text-center fluid">
        <aside class="logo"><img src="../../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button" id="backBtn"><img src="../../Resources/Icons/leave-svgrepo-com.svg" alt="back" height="30px" width="30px" id="backBtn"></button>
        </section>
    </header>
    <main>
        <header>
            <h1 id="partyName">Your party</h1>
            <button class="circle-button" id="editBtn">Edit</button>
        </header>

        <article class="text-center customContainer">
            <div class="row g-2">
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">2</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">3</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">4</section>
                </div>
                <div class="col-6 g-1">
                    <section class="square-item rounded-2">5</section>
                </div>
            </div>
        </article>
        <footer>
            <div class="customRow">
                <button class="circle-button ftbt" id="virtual">Virtual Game</button>
                <button class="circle-button ftbt" id="sync">Board - Sync</button>
            </div>
            <button class="circle-button" id="startBtn">start</button>
        </footer>
        <script src="config.js"></script>
    </main>
</body>
</html>
