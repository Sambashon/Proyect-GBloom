<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lobby.css">
</head>
<body>
    <header>
        <aside class="logo"><img src="../../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button"><img src="../../Resources/Icons/leave-svgrepo-com.svg" alt="back" height="30px" width="30px" id="backBtn"></button>
        </section>
    </header>
    <main>
        <header>
            <h1>Player 1's party</h1>
        </header>

        <article class="container text-center" id="players">
            
            <section class="row flex-nowrap justify-content-center">
                <section class="col">
                    <div class="profileContainer">
                        <img src="../../Resources/Icons/defautlprofilepic.png" alt="profilepicture" height="100" width="100">
                    </div>
                </section>
                <section class="col">
                    <div class="profileContainer">
                        <img src="../../Resources/Icons/defautlprofilepic.png" alt="profilepicture" height="100" width="100">
                    </div>
                </section>
                <section class="col">
                    <div class="profileContainer"></div>
                </section>
            </section>

            <section class="row flex-nowrap justify-content-center">
                <section class="col">
                    <div class="profileContainer"></div>
                </section>
                <section class="col">
                    <div class="profileContainer"></div>
                </section>
            </section>
        </article>

        <h2>2/5 Players</h2>
        <button class="circle-button" id="joinBtn">Join Party</button>
        <script src="lobby.js"></script>
    </main>
</body>
</html>
