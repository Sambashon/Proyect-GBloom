<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redacted Tabs Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <style>
    body{
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .square-item {
  aspect-ratio: 1 / 1;      /* Makes it a square */
  background-color: #d59f0a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  border: 2px solid white;
}
.customContainer{
    width: 40vw;
    height: 40vw;
}
  </style>

<article class="container text-center customContainer">
  <div class="row g-2">
    <div class="col-6">
      <section class="square-item">1</section>
    </div>
    <div class="col-6">
      <section class="square-item">2</section>
    </div>
    <div class="col-6">
      <section class="square-item">3</section>
    </div>
    <div class="col-6">
      <section class="square-item">4</section>
    </div>
  </div>
</article>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
