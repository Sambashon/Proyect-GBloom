<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../Resources/Logo/GbloomClassic.svg">
    <title>Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="confirmation.css">
    
</head>
<body>
    <header>
        <aside class="logo"><img src="../../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button" id="xOut"><h2>X</h2></button>
        </section>
    </header>
    <main>
        <form onsubmit="return false;">
            <section>
                <h1 class="fs-1">New Here?</h1>
                <button class="circle-button" id="registerBtn">create account</button>
            </section>
            <hr>
            <section>
                <h1 class="fs-1">Already have an account?</h1>
                <button class="circle-button" id="loginBtn">Login</button>
            </section>
            <hr>
            <section>
                <h1 class="fs-1">Play without an account</h1>
                <button class="circle-button" id="playWithoutBtn"><img src="../../Resources/Icons/play-1003-svgrepo-com.svg"></button>
            </section>
        </form>
    </main>
    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
