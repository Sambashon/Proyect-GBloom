<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game</title>
    <link rel="icon" href="../../Resources/Logo/GbloomClassic.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bayon&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
    
</head>
<body>
    <header>
        <aside class="logo"><img src="../../Resources/Logo/GBloomHorizontal.svg" alt="GBLOOM"></aside>
        <section>
            <button class="circle-button"><img src="../../Resources/Icons/pause-svgrepo-com.svg" alt="pause" height="30px" width="30px" id="pauseBtn"></button>
            <button class="circle-button"><img src="../../Resources/Icons/stats-svgrepo-com.svg" alt="leaderboard" height="30px" width="30px" id="statsBtn"></button>
        </section>
    </header>
    <main>
        <H1 id="score">Score: 10pts</H1>
        <img src="../../Resources/Backgrounds/image.png" alt="draftosaurusLogo">

        <article class="buttonMenu d-none" id="pausedMenu">
            <header>
                <h2>Game Paused</h2> <button class="circle-button" id="xOut">x</button>
            </header>
            <div class="BUTTONS-WRAPPER">
                <button class="circle-button" id="SETTINGSBtn"><img src="../../Resources/Icons/settings-svgrepo-com.svg" alt="settings"></button>
                <button class="circle-button" id="PLAYBtn"><img src="../../Resources/Icons/play-1003-svgrepo-com.svg" alt="play"></button>
                <button class="circle-button" id="LEAVEBtn"><img src="../../Resources/Icons/leave-svgrepo-com.svg" alt="leave"></button>
            </div>

        </article>
        <article class="buttonMenu d-none" id="statsMenu">
            <header>
                <h2>leaderboard</h2> <button class="circle-button" id="xOut">x</button>
            </header>
            <p>You _______ 10pts</p>
            <hr>
            <p>Player2 _______ 2pts</p>
            <hr>
            <p>Player3 _______ 1pt</p>

        </article>

        <article class="buttonMenu d-none" id="leaveMenu">
            <header>
                <h3>You are currently hosting this game you can choose to:</h3> <button class="circle-button" id="xOut">x</button>
            </header>
            <div class="BUTTONS-WRAPPER">
                <button class="circle-button" id="endGameBtn">EndGame</button>
                <button class="circle-button" id="tohomeBtn">Leave</button>
            </div>
            
        </article>
    </main>
    <footer>
            <aside class="DICE-CONTAINER">
                <section>
                    <img src="../../Resources/dado/dado1.svg" alt="Dado 1" class="mx-auto d-block" id="dice">
                </section>
                <button class="circle-button" id="diceBtn">RollDice</button>
            </aside>
            <section class="INVENTORY-WRAPPER">
                <header class="title-row">
                    <h4>Dino Inventory</h4>
                </header>
                <section class="INVENTORY">
                    <section>
                        <img src="../../Resources/dinosaurios/dinoAmarillo.svg" alt="DinoAmarillo">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../../Resources/dinosaurios/dinoAzul.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../../Resources/dinosaurios/dinoRojo.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../../Resources/dinosaurios/dinoMorado.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../../Resources/dinosaurios/dinoVerde.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span>10x</span>
                    </section>
                    <section>
                        <img src="../../Resources/dinosaurios/dinoNaranja.svg" alt="DinoAmarillo" class="mx-auto d-block">
                        <span>10x</span>
                    </section>
                </section>
                
            </section>
        </footer>

    <script src="dice.js"></script>
    <script src="gameUI.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
